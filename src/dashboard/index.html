<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainBase - Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06060F;
  --cyan: #00F0FF;
  --purple: #A855F7;
  --pink: #FF2D78;
  --gold: #FFB800;
  --green: #22D3A7;
  --red: #F87171;
  --muted: #6B7280;
  --glass-bg: rgba(10,12,25,0.7);
  --glass-border: rgba(255,255,255,0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: #fff;
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  overflow: hidden;
  height: 100vh;
}
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

#canvas3d {
  position: fixed; top: 0; left: 60px; width: calc(100% - 60px); height: 100%;
  z-index: 0;
}

#loader {
  position: fixed; top: 0; left: 60px; right: 0; bottom: 0;
  z-index: 100; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: var(--bg);
  transition: opacity 0.8s ease, visibility 0.8s;
}
#loader.hidden { opacity: 0; visibility: hidden; }
#loader-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--cyan);
  animation: loaderPulse 1.2s ease-in-out infinite;
  box-shadow: 0 0 20px var(--cyan), 0 0 60px rgba(0,240,255,0.3);
}
#loader-text {
  margin-top: 16px; font-size: 12px; color: rgba(255,255,255,0.4);
  font-family: 'JetBrains Mono', monospace; letter-spacing: 1px;
}
@keyframes loaderPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.8); opacity: 0.4; }
}

#sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: 60px;
  background: var(--glass-bg);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--glass-border);
  z-index: 200;
  display: flex; flex-direction: column; align-items: center;
  padding: 16px 0;
}
#sidebar-logo {
  width: 32px; height: 32px; margin-bottom: 24px;
  cursor: default;
}
.sidebar-btn {
  width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--muted);
  transition: all 0.25s ease; margin-bottom: 4px;
  border: none; background: none; position: relative;
}
.sidebar-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
.sidebar-btn.active {
  color: var(--cyan);
  background: rgba(0,240,255,0.08);
}
.sidebar-btn.active::before {
  content: ''; position: absolute; left: -2px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 20px; border-radius: 0 3px 3px 0;
  background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan);
}
.sidebar-btn svg { width: 20px; height: 20px; }
.sidebar-btn .btn-label {
  position: absolute; left: 56px; background: rgba(10,12,25,0.95);
  border: 1px solid var(--glass-border); border-radius: 6px;
  padding: 4px 10px; font-size: 11px; color: #ccc;
  white-space: nowrap; pointer-events: none;
  opacity: 0; transform: translateX(-4px);
  transition: all 0.2s ease;
}
.sidebar-btn:hover .btn-label { opacity: 1; transform: translateX(0); }

#sidebar-health-wrap {
  margin-top: auto; width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
}

#brain-ui {
  position: fixed; top: 0; left: 60px; right: 0; bottom: 0;
  pointer-events: none; z-index: 5;
}

#search-box {
  pointer-events: auto; position: absolute; top: 20px; left: 24px;
}
#search-box input {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 10px; padding: 10px 16px 10px 36px; color: #fff;
  font-size: 13px; font-family: 'Inter', sans-serif;
  width: 240px; outline: none;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  transition: border-color 0.3s, box-shadow 0.3s;
}
#search-box input:focus {
  border-color: rgba(0,240,255,0.3);
  box-shadow: 0 0 20px rgba(0,240,255,0.08);
}
#search-box input::placeholder { color: rgba(255,255,255,0.2); }
#search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--muted); width: 14px; height: 14px;
}

#legend {
  pointer-events: auto; position: absolute; top: 20px; right: 24px;
  display: flex; gap: 8px; font-size: 11px;
  flex-wrap: wrap; max-width: 500px; justify-content: flex-end;
}
.legend-item {
  display: flex; align-items: center; gap: 5px;
  cursor: pointer; opacity: 0.5; transition: all 0.25s; user-select: none;
  padding: 4px 8px; border-radius: 6px;
}
.legend-item:hover { opacity: 1; background: rgba(255,255,255,0.04); }
.legend-item.active { opacity: 1; }
.legend-item.hidden { opacity: 0.15; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.legend-overflow {
  display: flex; align-items: center; gap: 5px;
  cursor: pointer; opacity: 0.6; transition: all 0.25s; user-select: none;
  padding: 4px 10px; border-radius: 6px;
  background: rgba(255,255,255,0.06); font-size: 10px; color: var(--muted);
}
.legend-overflow:hover { opacity: 1; background: rgba(255,255,255,0.1); }

#stats-panel {
  pointer-events: auto; position: absolute; bottom: 24px; left: 24px;
  background: var(--glass-bg);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 16px; padding: 20px 24px;
  min-width: 300px;
}
.stats-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
  margin-bottom: 12px;
}
.stats-grid-small {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
  padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.04);
}
.stat-item { display: flex; flex-direction: column; gap: 2px; }
.stat-val {
  font-size: 26px; font-weight: 700; color: #fff;
  font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums;
  line-height: 1;
}
.stat-val-sm { font-size: 18px; }
.stat-lbl {
  font-size: 9px; text-transform: uppercase;
  letter-spacing: 1.5px; color: rgba(255,255,255,0.25); font-weight: 500;
}
#stats-health {
  display: flex; align-items: center; gap: 12px;
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,0.04);
}
#stats-health-label {
  font-size: 9px; text-transform: uppercase;
  letter-spacing: 1.5px; color: rgba(255,255,255,0.25); font-weight: 500;
}

#live-status {
  pointer-events: auto; position: absolute; bottom: 28px; right: 24px;
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; color: var(--green); letter-spacing: 0.5px;
  font-family: 'JetBrains Mono', monospace;
}
#live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green);
  animation: livePulse 2s ease-in-out infinite;
  box-shadow: 0 0 6px var(--green);
}
#live-status.offline { color: var(--red); }
#live-status.offline #live-dot {
  background: var(--red); box-shadow: 0 0 6px var(--red);
}
#live-status.paused { color: var(--gold); }
#live-status.paused #live-dot {
  background: var(--gold); box-shadow: 0 0 6px var(--gold);
  animation: none;
}
@keyframes livePulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

#detail-panel {
  pointer-events: auto; position: absolute; top: 0; right: 0;
  width: 360px; height: 100%;
  background: var(--glass-bg);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-left: 1px solid var(--glass-border);
  z-index: 15; overflow-y: auto; padding: 28px;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
#detail-panel.open { transform: translateX(0); }
.dp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.dp-type {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 1.5px; font-weight: 600;
  padding: 5px 12px; border-radius: 8px;
  background: rgba(255,255,255,0.05);
}
.dp-close {
  width: 30px; height: 30px; border-radius: 8px; border: none;
  background: rgba(255,255,255,0.05); color: #666;
  font-size: 18px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: all 0.2s;
}
.dp-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
.dp-content {
  font-size: 14px; line-height: 1.7; color: #e0e0e0;
  margin-bottom: 16px; word-break: break-word;
}
.dp-content.collapsed {
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden;
}
.dp-expand-btn {
  font-size: 11px; color: var(--cyan); background: none; border: none;
  cursor: pointer; padding: 4px 0; margin-bottom: 16px;
  font-family: 'Inter', sans-serif; opacity: 0.7;
  transition: opacity 0.2s; display: none;
}
.dp-expand-btn:hover { opacity: 1; }
.dp-bar-group { margin-bottom: 12px; }
.dp-bar-label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 1px; color: rgba(255,255,255,0.3); margin-bottom: 5px; display: block;
}
.dp-bar {
  height: 4px; background: rgba(255,255,255,0.06);
  border-radius: 2px; overflow: hidden;
}
.dp-bar-fill {
  height: 100%; border-radius: 2px;
  transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.dp-meta {
  margin-top: 20px; font-size: 11px; color: rgba(255,255,255,0.35); line-height: 2;
}
.dp-connected-header {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 1.5px; color: rgba(255,255,255,0.25);
  margin-top: 24px; margin-bottom: 12px; font-weight: 500;
}
.dp-connected { display: flex; flex-wrap: wrap; gap: 6px; }
.dp-chip {
  font-size: 11px; padding: 6px 12px; border-radius: 8px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
  cursor: pointer; transition: all 0.25s; max-width: 100%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dp-chip:hover {
  background: rgba(0,240,255,0.08); border-color: rgba(0,240,255,0.3);
  transform: translateY(-1px);
}

.tab-content {
  position: fixed; top: 0; left: 60px; right: 0; bottom: 0;
  overflow-y: auto; padding: 36px 44px;
  background: var(--bg);
  z-index: 10; display: none;
  animation: tabFadeIn 0.3s ease;
}
@keyframes tabFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.tab-header {
  font-size: 24px; font-weight: 700; margin-bottom: 8px;
  letter-spacing: -0.5px;
}
.tab-subtitle {
  font-size: 13px; color: var(--muted); margin-bottom: 32px;
}

.glass-card {
  background: var(--glass-bg);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: 16px; padding: 24px;
  transition: border-color 0.3s;
}
.glass-card:hover { border-color: rgba(255,255,255,0.1); }

.section-label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 1.5px; color: var(--muted); font-weight: 600;
  margin-bottom: 18px;
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 1000px) { .grid-2 { grid-template-columns: 1fr; } }

.health-rings { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
.health-ring-item { text-align: center; }

.expertise-item {
  margin-bottom: 18px; padding: 14px; border-radius: 12px;
  background: rgba(255,255,255,0.02); transition: background 0.2s;
}
.expertise-item:hover { background: rgba(255,255,255,0.04); }
.expertise-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.expertise-domain { font-size: 14px; font-weight: 600; text-transform: capitalize; }
.expertise-level {
  font-size: 11px; font-family: 'JetBrains Mono', monospace;
  color: var(--cyan);
}
.expertise-bar {
  height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden;
}
.expertise-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
}
.expertise-meta {
  font-size: 10px; color: var(--muted); margin-top: 6px;
  display: flex; gap: 12px;
}
.expertise-trend {
  font-size: 12px; padding: 2px 6px; border-radius: 4px;
}

.pattern-card {
  padding: 16px; border-radius: 12px;
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
  transition: all 0.25s; margin-bottom: 10px;
}
.pattern-card:hover {
  background: rgba(255,255,255,0.04);
  border-color: rgba(255,255,255,0.08);
  transform: translateY(-1px);
}
.pattern-desc { font-size: 13px; line-height: 1.6; margin-bottom: 10px; }
.pattern-footer { display: flex; gap: 8px; align-items: center; }
.pattern-badge {
  font-size: 10px; padding: 3px 10px; border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  background: rgba(0,240,255,0.1); color: var(--cyan);
}
.pattern-count {
  font-size: 10px; color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
}

.decision-item {
  display: flex; gap: 16px; padding: 16px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.decision-item:last-child { border-bottom: none; }
.decision-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--pink); margin-top: 5px; flex-shrink: 0;
  box-shadow: 0 0 8px rgba(255,45,120,0.4);
}
.decision-content { font-size: 13px; line-height: 1.6; flex: 1; }
.decision-date { font-size: 10px; color: var(--muted); margin-top: 4px; }

.memory-filters {
  display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px;
}
.filter-pill {
  font-size: 11px; padding: 6px 14px; border-radius: 20px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
  cursor: pointer; transition: all 0.2s; color: #aaa;
  font-family: 'Inter', sans-serif; user-select: none;
}
.filter-pill:hover { background: rgba(255,255,255,0.08); color: #fff; }
.filter-pill.active {
  background: rgba(0,240,255,0.1); border-color: rgba(0,240,255,0.3);
  color: var(--cyan);
}

.memory-card {
  padding: 16px 18px; border-radius: 12px;
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
  margin-bottom: 8px; transition: all 0.25s; cursor: default;
}
.memory-card:hover {
  background: rgba(255,255,255,0.04);
  border-color: rgba(255,255,255,0.08);
}
.memory-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.memory-type {
  font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
  padding: 3px 8px; border-radius: 4px; font-weight: 600;
}
.memory-date { font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
.memory-text { font-size: 13px; line-height: 1.6; color: #ccc; margin-bottom: 8px; }
.memory-importance {
  height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden;
}
.memory-importance-fill { height: 100%; border-radius: 2px; }

.memory-search {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 10px 16px; color: #fff;
  font-size: 13px; font-family: 'Inter', sans-serif;
  width: 100%; outline: none; margin-bottom: 16px;
  transition: border-color 0.3s;
}
.memory-search:focus { border-color: rgba(0,240,255,0.3); }
.memory-search::placeholder { color: rgba(255,255,255,0.2); }

.show-more-btn {
  display: block; width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; background: rgba(255,255,255,0.02); color: var(--muted);
  font-size: 12px; cursor: pointer; transition: all 0.2s;
  font-family: 'Inter', sans-serif; margin-top: 12px;
}
.show-more-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }

.chart-container { position: relative; }
#growth-chart { width: 100%; display: block; }

.session-group { margin-bottom: 24px; }
.session-date-header {
  font-size: 11px; color: var(--muted); font-weight: 600;
  letter-spacing: 1px; text-transform: uppercase;
  margin-bottom: 10px; padding-bottom: 6px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.session-card {
  display: flex; gap: 14px; align-items: flex-start;
  padding: 14px; border-radius: 10px;
  background: rgba(255,255,255,0.02); margin-bottom: 6px;
  transition: all 0.2s;
}
.session-card:hover { background: rgba(255,255,255,0.04); }
.session-badge {
  font-size: 9px; padding: 4px 10px; border-radius: 6px;
  font-family: 'JetBrains Mono', monospace; text-transform: uppercase;
  letter-spacing: 0.5px; white-space: nowrap; margin-top: 2px;
  background: rgba(168,85,247,0.15); color: var(--purple);
}
.session-info { flex: 1; }
.session-time { font-size: 12px; color: #ccc; margin-bottom: 4px; }
.session-meta { font-size: 11px; color: var(--muted); }
.session-topics { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.topic-chip {
  font-size: 9px; padding: 3px 8px; border-radius: 4px;
  background: rgba(255,255,255,0.05); color: #999;
}

.brain-overview {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px; margin-top: 24px;
}
.overview-card {
  padding: 16px; border-radius: 12px;
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
  text-align: center;
}
.overview-val {
  font-size: 28px; font-weight: 700;
  font-family: 'JetBrains Mono', monospace; line-height: 1;
  margin-bottom: 4px;
}
.overview-lbl {
  font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
}

.empty-state {
  text-align: center; padding: 48px 24px; color: var(--muted); font-size: 14px;
}

.donut-container { display: flex; justify-content: center; align-items: center; }

.growth-toast {
  position: fixed; bottom: 60px; right: 24px;
  background: rgba(10,12,25,0.85);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(0,240,255,0.15);
  border-radius: 12px; padding: 12px 20px;
  font-size: 13px; font-family: 'JetBrains Mono', monospace;
  color: var(--cyan); z-index: 50;
  box-shadow: 0 0 20px rgba(0,240,255,0.1), 0 4px 24px rgba(0,0,0,0.4);
  animation: toastIn 0.4s cubic-bezier(0.16,1,0.3,1) forwards;
  pointer-events: none;
}
.growth-toast.fade-out {
  animation: toastOut 0.5s ease forwards;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes toastOut {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(-10px); }
}

.memory-locate-btn {
  background: none; border: 1px solid rgba(255,255,255,0.08);
  color: var(--muted); border-radius: 6px; padding: 4px 10px;
  font-size: 10px; cursor: pointer; transition: all 0.2s;
  font-family: 'Inter', sans-serif; display: inline-flex;
  align-items: center; gap: 4px; margin-top: 8px;
}
.memory-locate-btn:hover {
  color: var(--cyan); border-color: rgba(0,240,255,0.3);
  background: rgba(0,240,255,0.05);
}
.memory-locate-btn svg { width: 12px; height: 12px; }

#brain-level {
  font-size: 11px; font-family: 'JetBrains Mono', monospace;
  font-weight: 600; letter-spacing: 0.5px; margin-top: 2px;
}

#live-status { cursor: pointer; }
#live-tooltip {
  position: absolute; bottom: 100%; right: 0; margin-bottom: 8px;
  background: rgba(10,12,25,0.95); border: 1px solid var(--glass-border);
  border-radius: 8px; padding: 8px 12px; font-size: 11px;
  color: #aaa; white-space: nowrap; pointer-events: none;
  opacity: 0; transform: translateY(4px);
  transition: all 0.2s ease; font-family: 'JetBrains Mono', monospace;
}
#live-status:hover #live-tooltip { opacity: 1; transform: translateY(0); }
#live-status:hover { opacity: 0.8; }
#live-status:not(.offline):not(.paused):hover #live-text::after { content: ' (click to pause)'; font-size: 9px; color: var(--muted); }

{
  "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const TYPE_COLORS = {
  core: 0x00F0FF, fact: 0x38BDF8,
  identity: 0xFFB800, preference: 0x22D3A7,
  decision: 0xFF2D78, frustration: 0xF87171,
  failure: 0xEF4444, project: 0xA855F7,
  pattern: 0x818CF8, system_knowledge: 0x94A3B8,
  auto_topic: 0x7C8DB5, task: 0xFFB800,
  prospective: 0xFBBF24, tacit: 0xC084FC,
  entity: 0x06B6D4, episode: 0xF472B6,
  example: 0x34D399, skill: 0xFB923C,
  insight: 0xE879F9,
};

function hashColor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
  const hue = ((h % 360) + 360) % 360;
  const s = 65 + (h % 20);
  const l = 55 + (h % 15);
  const c = (1 - Math.abs(2 * l / 100 - 1)) * s / 100;
  const x = c * (1 - Math.abs((hue / 60) % 2 - 1));
  const m = l / 100 - c / 2;
  let r, g, b;
  if (hue < 60) { r = c; g = x; b = 0; }
  else if (hue < 120) { r = x; g = c; b = 0; }
  else if (hue < 180) { r = 0; g = c; b = x; }
  else if (hue < 240) { r = 0; g = x; b = c; }
  else if (hue < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return ((Math.round((r + m) * 255) << 16) | (Math.round((g + m) * 255) << 8) | Math.round((b + m) * 255));
}
function getColor(type) { return TYPE_COLORS[type] || hashColor(type); }
function getColorHex(type) { return '#' + getColor(type).toString(16).padStart(6, '0'); }
function formatDate(ts) {
  if (!ts) return '\u2014';
  return new Date(ts).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });
}
function formatDateTime(ts) {
  if (!ts) return '\u2014';
  const d = new Date(ts);
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' ' +
    d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}
function formatDateFull(ts) {
  if (!ts) return '\u2014';
  return new Date(ts).toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
}
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3) / 2; }
function formatNumber(n) {
  if (n >= 10000000) return Math.round(n / 1000000) + 'M';
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return Math.round(n / 1000) + 'k';
  return String(n);
}

let currentTab = 'brain';
let graphNodes = [];
let graphEdges = [];
let nodeMap = {};
let simNodes = [];
let nodeMeshes = [];
let edgeLines = null;
let searchQuery = '';
let hiddenTypes = new Set();
let selectedNode = null;
let hoveredMeshIndex = -1;
let frameCount = 0;
let brainFormingStart = -1;
let isBrainForming = false;
let spreadingState = null;
let flyState = null;
let healthScore = 0;
let lastInteraction = 0;
let autoRotating = false;
let mouseNDC = new THREE.Vector2(9999, 9999);
let dataLoaded = false;


let nodeDegree = [];
let physicsEdges = [];

let flowParticles = null;
let flowData = [];

let dustParticles = null;

let neuralPulseTime = 0;
let neuralPulseCenter = null;
let neuralPulseActive = false;

const canvas = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setSize(window.innerWidth - 60, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x06060F);
renderer.toneMapping = THREE.ReinhardToneMapping;
renderer.toneMappingExposure = 1.5;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06060F, 0.0008);

const camera = new THREE.PerspectiveCamera(60, (window.innerWidth - 60) / window.innerHeight, 0.1, 2000);
camera.position.set(0, 30, 250);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.5;
controls.zoomSpeed = 1.0;
controls.panSpeed = 0.6;
controls.minDistance = 15;
controls.maxDistance = 600;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth - 60, window.innerHeight), 1.0, 0.5, 0.2
);
composer.addPass(bloomPass);

window.addEventListener('resize', () => {
  const w = window.innerWidth - 60;
  camera.aspect = w / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(w, window.innerHeight);
  composer.setSize(w, window.innerHeight);
  bloomPass.resolution.set(w, window.innerHeight);
});

const nodeGroup = new THREE.Group();
const edgeGroup = new THREE.Group();
const flowGroup = new THREE.Group();
scene.add(edgeGroup);
scene.add(flowGroup);
scene.add(nodeGroup);

function createDust() {
  const count = 600;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    pos[i*3] = (Math.random()-0.5)*800;
    pos[i*3+1] = (Math.random()-0.5)*800;
    pos[i*3+2] = (Math.random()-0.5)*800;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  dustParticles = new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0x1a1a3e, size: 0.8, transparent: true, opacity: 0.4,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  scene.add(dustParticles);
}
createDust();

const glowCanvas = document.createElement('canvas');
glowCanvas.width = 256; glowCanvas.height = 256;
const glowCtx = glowCanvas.getContext('2d');
const grad = glowCtx.createRadialGradient(128,128,0,128,128,128);
grad.addColorStop(0, 'rgba(20,8,50,0.4)');
grad.addColorStop(0.4, 'rgba(10,4,30,0.2)');
grad.addColorStop(1, 'rgba(0,0,0,0)');
glowCtx.fillStyle = grad;
glowCtx.fillRect(0,0,256,256);
const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: new THREE.CanvasTexture(glowCanvas),
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
}));
glowSprite.scale.set(400, 400, 1);
scene.add(glowSprite);

function createNodeMesh(node, position) {
  const importance = node.importance || 0.5;
  const radius = 1.2 + importance * 3;
  const geo = new THREE.SphereGeometry(radius, 20, 14);
  const mat = new THREE.MeshBasicMaterial({
    color: getColor(node.type), transparent: true,
    opacity: 0.75 + importance * 0.25,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(position);
  mesh.userData = {
    node, baseRadius: radius,
    baseOpacity: 0.75 + importance * 0.25,
    baseScale: 1,
    activation: node.activation || 0,
    pulseOffset: Math.random() * Math.PI * 2,
    flashTime: 0,
  };
  return mesh;
}

function computeNodeDegree() {
  nodeDegree = new Array(graphNodes.length).fill(0);
  for (const edge of graphEdges) {
    const si = nodeMap[edge.source_id], ti = nodeMap[edge.target_id];
    if (si !== undefined) nodeDegree[si]++;
    if (ti !== undefined) nodeDegree[ti]++;
  }
}

function buildPhysicsEdges() {
  const maxPerNode = 8;
  const edgesPerNode = new Array(graphNodes.length).fill(null).map(() => []);
  for (const e of graphEdges) {
    const si = nodeMap[e.source_id], ti = nodeMap[e.target_id];
    if (si !== undefined) edgesPerNode[si].push(e);
    if (ti !== undefined) edgesPerNode[ti].push(e);
  }
  const selected = new Set();
  for (let i = 0; i < graphNodes.length; i++) {
    const edges = edgesPerNode[i];
    edges.sort((a, b) => (b.strength || 0.5) - (a.strength || 0.5));
    for (let j = 0; j < Math.min(maxPerNode, edges.length); j++) {
      selected.add(edges[j]);
    }
  }
  physicsEdges = Array.from(selected);
}

function rebuildEdges() {
  while (edgeGroup.children.length > 0) {
    const c = edgeGroup.children[0];
    c.geometry.dispose(); c.material.dispose(); edgeGroup.remove(c);
  }
  const positions = [], colors = [];
  for (const edge of physicsEdges) {
    const si = nodeMap[edge.source_id], ti = nodeMap[edge.target_id];
    if (si === undefined || ti === undefined) continue;
    const a = simNodes[si], b = simNodes[ti];
    if (!a || !b) continue;
    if (hiddenTypes.has(a.node.type) || hiddenTypes.has(b.node.type)) continue;
    positions.push(a.x, a.y, a.z, b.x, b.y, b.z);
    const cA = new THREE.Color(getColor(a.node.type));
    const cB = new THREE.Color(getColor(b.node.type));
    const alpha = 0.1 + (edge.strength || 0.5) * 0.3;
    colors.push(cA.r*alpha, cA.g*alpha, cA.b*alpha);
    colors.push(cB.r*alpha, cB.g*alpha, cB.b*alpha);
  }
  if (positions.length === 0) { edgeLines = null; return; }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  edgeLines = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  edgeGroup.add(edgeLines);
}

function rebuildEdgePositions() {
  if (!edgeLines) return;
  const pos = edgeLines.geometry.attributes.position;
  if (!pos) return;
  let idx = 0;
  for (const edge of physicsEdges) {
    const si = nodeMap[edge.source_id], ti = nodeMap[edge.target_id];
    if (si === undefined || ti === undefined) continue;
    const a = simNodes[si], b = simNodes[ti];
    if (!a || !b) continue;
    if (hiddenTypes.has(a.node.type) || hiddenTypes.has(b.node.type)) continue;
    pos.array[idx*3]=a.x; pos.array[idx*3+1]=a.y; pos.array[idx*3+2]=a.z; idx++;
    pos.array[idx*3]=b.x; pos.array[idx*3+1]=b.y; pos.array[idx*3+2]=b.z; idx++;
  }
  pos.needsUpdate = true;
}

function createFlowParticles() {
  while (flowGroup.children.length > 0) {
    const c = flowGroup.children[0];
    c.geometry.dispose(); c.material.dispose(); flowGroup.remove(c);
  }
  flowData = [];

  const particlesPerEdge = 3;
  const posArr = [], colArr = [];

  for (const edge of physicsEdges) {
    const si = nodeMap[edge.source_id], ti = nodeMap[edge.target_id];
    if (si === undefined || ti === undefined) continue;
    const a = simNodes[si], b = simNodes[ti];
    if (!a || !b) continue;
    if (hiddenTypes.has(a.node.type) || hiddenTypes.has(b.node.type)) continue;
    const col = new THREE.Color(getColor(a.node.type)).lerp(new THREE.Color(getColor(b.node.type)), 0.5);
    for (let p = 0; p < particlesPerEdge; p++) {
      const t = p / particlesPerEdge;
      flowData.push({ si, ti, t: t + Math.random() * 0.1, speed: 0.003 + Math.random() * 0.005 });
      posArr.push(a.x + (b.x-a.x)*t, a.y + (b.y-a.y)*t, a.z + (b.z-a.z)*t);
      colArr.push(col.r, col.g, col.b);
    }
  }

  if (flowData.length === 0) { flowParticles = null; return; }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(posArr), 3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colArr), 3));
  flowParticles = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 1.0, vertexColors: true, transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  flowGroup.add(flowParticles);
}

function updateFlowParticles() {
  if (!flowParticles || flowData.length === 0) return;
  const pos = flowParticles.geometry.attributes.position;
  for (let i = 0; i < flowData.length; i++) {
    const fd = flowData[i];
    fd.t += fd.speed;
    if (fd.t > 1) fd.t -= 1;
    const a = simNodes[fd.si], b = simNodes[fd.ti];
    if (!a || !b) continue;
    pos.array[i*3] = a.x + (b.x - a.x) * fd.t;
    pos.array[i*3+1] = a.y + (b.y - a.y) * fd.t;
    pos.array[i*3+2] = a.z + (b.z - a.z) * fd.t;
  }
  pos.needsUpdate = true;
}

function initSimulation() {
  const typeGroups = {};
  graphNodes.forEach(n => {
    if (!typeGroups[n.type]) typeGroups[n.type] = [];
    typeGroups[n.type].push(n);
  });
  const typeOffsets = {};
  const types = Object.keys(typeGroups);
  types.forEach((t, i) => {
    const angle = (i / types.length) * Math.PI * 2;
    const spread = Math.max(30, Math.sqrt(graphNodes.length) * 5);
    typeOffsets[t] = { x: Math.cos(angle) * spread, y: 0, z: Math.sin(angle) * spread };
  });

  simNodes = graphNodes.map((n, i) => {
    const a1 = (i / graphNodes.length) * Math.PI * 2;
    const a2 = (Math.random() - 0.5) * Math.PI;
    const r = 40 + Math.random() * 80;
    const off = typeOffsets[n.type] || { x:0, y:0, z:0 };
    return {
      x: Math.cos(a1)*Math.cos(a2)*r + off.x,
      y: Math.sin(a2)*r + off.y,
      z: Math.sin(a1)*Math.cos(a2)*r + off.z,
      vx:0, vy:0, vz:0, node: n,
    };
  });
  while (nodeGroup.children.length > 0) {
    const c = nodeGroup.children[0];
    c.geometry.dispose(); c.material.dispose(); nodeGroup.remove(c);
  }
  nodeMeshes = [];
  for (const sn of simNodes) {
    const mesh = createNodeMesh(sn.node, new THREE.Vector3(sn.x, sn.y, sn.z));
    nodeGroup.add(mesh);
    nodeMeshes.push(mesh);
  }
  computeNodeDegree();
  buildPhysicsEdges();
  // Pre-simulate 150 steps so nodes reach equilibrium before camera setup
  for (let i = 0; i < 150; i++) stepSimulation();
  // Update mesh positions to match pre-simulated positions
  for (let i = 0; i < simNodes.length; i++) {
    const sn = simNodes[i];
    nodeMeshes[i].position.set(sn.x, sn.y, sn.z);
  }
  rebuildEdges();
  createFlowParticles();
  let maxDist = 0;
  for (const sn of simNodes) {
    const d = Math.sqrt(sn.x*sn.x + sn.y*sn.y + sn.z*sn.z);
    if (d > maxDist) maxDist = d;
  }
  const fitDist = Math.max(200, maxDist * 2.5);
  camera.position.set(0, fitDist * 0.15, fitDist);
  controls.target.set(0, 0, 0);
  controls.maxDistance = Math.max(300, maxDist * 3.5);
  camera.far = Math.max(2000, maxDist * 8);
  camera.updateProjectionMatrix();
  scene.fog = new THREE.FogExp2(0x06060F, Math.min(0.0008, 0.15 / fitDist));
  brainFormingStart = performance.now();
  isBrainForming = true;
}

function updateMaxZoom() {
  if (simNodes.length === 0) return;
  let maxDist = 0;
  for (const sn of simNodes) {
    const d = Math.sqrt(sn.x*sn.x + sn.y*sn.y + sn.z*sn.z);
    if (d > maxDist) maxDist = d;
  }
  controls.maxDistance = Math.max(300, maxDist * 3.5);
  camera.far = Math.max(2000, maxDist * 8);
  camera.updateProjectionMatrix();
}


function stepSimulation() {
  const n = simNodes.length;
  if (n === 0) return;
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const a = simNodes[i], b = simNodes[j];
      let dx=a.x-b.x, dy=a.y-b.y, dz=a.z-b.z;
      let dist = Math.sqrt(dx*dx+dy*dy+dz*dz) || 1;
      let f = Math.min(1200/(dist*dist), 3);
      const fx=(dx/dist)*f, fy=(dy/dist)*f, fz=(dz/dist)*f;
      a.vx+=fx; a.vy+=fy; a.vz+=fz;
      b.vx-=fx; b.vy-=fy; b.vz-=fz;
    }
  }
  for (const e of physicsEdges) {
    const si=nodeMap[e.source_id], ti=nodeMap[e.target_id];
    if (si===undefined||ti===undefined) continue;
    const a=simNodes[si], b=simNodes[ti];
    const dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z;
    const dist=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
    const f=(dist-30)*0.005*(e.strength||0.5);
    const fx=(dx/dist)*f, fy=(dy/dist)*f, fz=(dz/dist)*f;
    a.vx+=fx; a.vy+=fy; a.vz+=fz;
    b.vx-=fx; b.vy-=fy; b.vz-=fz;
  }
  for (const sn of simNodes) { sn.vx-=sn.x*0.001; sn.vy-=sn.y*0.001; sn.vz-=sn.z*0.001; }
  const damp = 0.85;
  for (const sn of simNodes) {
    sn.vx*=damp; sn.vy*=damp; sn.vz*=damp;
    sn.x+=sn.vx; sn.y+=sn.vy; sn.z+=sn.vz;
  }
  for (let i=0; i<simNodes.length; i++) {
    const sn=simNodes[i]; const mesh=nodeMeshes[i];
    if (mesh) mesh.position.set(sn.x, sn.y, sn.z);
  }
  rebuildEdgePositions();
}

function triggerSpreading(nodeIndex) {
  const node = graphNodes[nodeIndex];
  if (!node) return;
  const hops = new Map();
  hops.set(nodeIndex, { hop: 0, time: 0 });
  let frontier = [nodeIndex];
  for (let hop = 1; hop <= 3; hop++) {
    const next = [];
    for (const idx of frontier) {
      const nid = graphNodes[idx].id;
      for (const e of graphEdges) {
        let tid = null;
        if (e.source_id === nid) tid = e.target_id;
        if (e.target_id === nid) tid = e.source_id;
        if (tid) {
          const tIdx = nodeMap[tid];
          if (tIdx !== undefined && !hops.has(tIdx)) {
            hops.set(tIdx, { hop, time: hop * 180 });
            next.push(tIdx);
          }
        }
      }
    }
    frontier = next;
  }
  spreadingState = { startTime: performance.now(), hops };
}

function updateSpreadingVisuals() {
  if (!spreadingState) return;
  const elapsed = performance.now() - spreadingState.startTime;
  for (const [idx, info] of spreadingState.hops) {
    const mesh = nodeMeshes[idx];
    if (!mesh) continue;
    const tSince = elapsed - info.time;
    if (tSince < 0) continue;
    const intensity = Math.max(0, 1 - info.hop * 0.25);
    const fadeOut = Math.max(0, 1 - tSince / 2500);
    const glow = intensity * fadeOut;
    const base = new THREE.Color(getColor(mesh.userData.node.type));
    mesh.material.color.copy(base).lerp(new THREE.Color(0xffffff), glow * 0.8);
    mesh.material.opacity = Math.min(1, mesh.userData.baseOpacity + glow * 0.3);
    mesh.scale.setScalar(1 + glow * 0.3);
  }
  if (edgeLines) {
    const col = edgeLines.geometry.attributes.color;
    let idx = 0;
    for (const edge of graphEdges) {
      const si=nodeMap[edge.source_id], ti=nodeMap[edge.target_id];
      if (si===undefined||ti===undefined) continue;
      const a=simNodes[si], b=simNodes[ti];
      if (!a||!b) continue;
      if (hiddenTypes.has(a.node.type)||hiddenTypes.has(b.node.type)) continue;
      let edgeGlow = 0;
      const aI=spreadingState.hops.get(si), bI=spreadingState.hops.get(ti);
      if (aI && bI) {
        const maxH = Math.max(aI.hop, bI.hop);
        const tS = elapsed - maxH * 180;
        if (tS > 0) edgeGlow = Math.max(0, 1 - maxH*0.25) * Math.max(0, 1 - tS/2500);
      }
      const cA=new THREE.Color(getColor(a.node.type));
      const cB=new THREE.Color(getColor(b.node.type));
      if (edgeGlow>0) { cA.lerp(new THREE.Color(0xffffff),edgeGlow*0.6); cB.lerp(new THREE.Color(0xffffff),edgeGlow*0.6); }
      const avgDeg = ((nodeDegree[si] || 0) + (nodeDegree[ti] || 0)) / 2;
      const densityFactor = Math.max(0.06, Math.pow(15 / Math.max(15, avgDeg), 0.85));
      const alpha = (0.08 + (edge.strength||0.5)*0.25) * densityFactor + edgeGlow*0.7;
      col.array[idx*3]=cA.r*alpha; col.array[idx*3+1]=cA.g*alpha; col.array[idx*3+2]=cA.b*alpha; idx++;
      col.array[idx*3]=cB.r*alpha; col.array[idx*3+1]=cB.g*alpha; col.array[idx*3+2]=cB.b*alpha; idx++;
    }
    col.needsUpdate = true;
  }
  if (elapsed > 3500) {
    spreadingState = null;
    for (const mesh of nodeMeshes) {
      mesh.material.color.setHex(getColor(mesh.userData.node.type));
      mesh.material.opacity = mesh.userData.baseOpacity;
      mesh.scale.setScalar(1);
    }
    rebuildEdges();
  }
}

function flyToNode(nodeIndex) {
  const sn = simNodes[nodeIndex];
  if (!sn) return;
  const target = new THREE.Vector3(sn.x, sn.y, sn.z);
  const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
  flyState = {
    startTime: performance.now(),
    startPos: camera.position.clone(),
    startTarget: controls.target.clone(),
    endPos: target.clone().add(dir.multiplyScalar(45)),
    endTarget: target,
  };
}

function updateFlyTo() {
  if (!flyState) return;
  const t = Math.min((performance.now() - flyState.startTime) / 900, 1);
  const e = easeInOutCubic(t);
  camera.position.lerpVectors(flyState.startPos, flyState.endPos, e);
  controls.target.lerpVectors(flyState.startTarget, flyState.endTarget, e);
  if (t >= 1) flyState = null;
}

    dpContent.classList.add('collapsed');

    dpExpand.textContent = 'Show more';
    dpExpand.onclick = () => {
      const isCollapsed = dpContent.classList.toggle('collapsed');
      dpExpand.textContent = isCollapsed ? 'Show more' : 'Show less';
    };
  } else {
    dpContent.classList.remove('collapsed');
    dpExpand.style.display = 'none';
  }

  document.getElementById('dp-confidence').style.width = ((node.confidence||0)*100)+'%';
  document.getElementById('dp-activation').style.width = ((node.activation||0)*100)+'%';

    `<div>Created: <span style="color:#ccc">${formatDate(node.created_at)}</span></div>` +
    `<div>Last Active: <span style="color:#ccc">${formatDate(node.last_activated)}</span></div>` +
    `<div>Source: <span style="color:#ccc">${node.source||'unknown'}</span></div>`;
  const cc = document.getElementById('dp-connected');
  cc.innerHTML = '';
  const connectedNodes = [];
  for (const edge of graphEdges) {
    let cid = null;
    if (edge.source_id === node.id) cid = edge.target_id;
    if (edge.target_id === node.id) cid = edge.source_id;
    if (!cid) continue;
    const cIdx = nodeMap[cid];
    if (cIdx === undefined) continue;
    connectedNodes.push({ cn: graphNodes[cIdx], cIdx });
  }
  const CHIP_LIMIT = 8;
  const visibleNodes = connectedNodes.slice(0, CHIP_LIMIT);

  for (const { cn, cIdx } of visibleNodes) {
    const chip = document.createElement('div');

    chip.textContent = cn.content.length > 40 ? cn.content.substring(0, 40) + '...' : cn.content;
    chip.title = cn.content;
    chip.style.borderColor = getColorHex(cn.type);
    chip.addEventListener('click', () => {
      selectedNode = cIdx;
      flyToNode(cIdx);
      showDetailPanel(cIdx);

    });

  }
  if (hiddenNodes.length > 0) {
    const moreBtn = document.createElement('div');
    moreBtn.className = 'dp-chip';
    moreBtn.textContent = `+${hiddenNodes.length} more`;
    moreBtn.style.color = 'var(--cyan)';
    moreBtn.style.cursor = 'pointer';
    moreBtn.style.textAlign = 'center';
    moreBtn.addEventListener('click', () => {
      moreBtn.remove();
      for (const { cn, cIdx } of hiddenNodes) {
        const chip = document.createElement('div');
        chip.className = 'dp-chip';
        chip.textContent = cn.content.length > 40 ? cn.content.substring(0, 40) + '...' : cn.content;
        chip.title = cn.content;
        chip.style.borderColor = getColorHex(cn.type);
        chip.addEventListener('click', () => {
          selectedNode = cIdx;
          flyToNode(cIdx);
          showDetailPanel(cIdx);
          triggerSpreading(cIdx);
        });
        cc.appendChild(chip);
      }
    });
    cc.appendChild(moreBtn);
  }
}

function updateProximityGlow() {
  if (currentTab !== 'brain') return;
  raycaster.setFromCamera(mouseNDC, camera);
  const ray = raycaster.ray;

  for (let i = 0; i < nodeMeshes.length; i++) {
    const mesh = nodeMeshes[i];
    mesh.userData.proximityGlow = 0;
    if (!mesh.visible) continue;
    const toNode = new THREE.Vector3().subVectors(mesh.position, ray.origin);
    const proj = toNode.dot(ray.direction);
    if (proj < 0) continue;
    const closest = new THREE.Vector3().copy(ray.direction).multiplyScalar(proj).add(ray.origin);
    const dist = closest.distanceTo(mesh.position);
    const proxRange = 30;
    if (dist < proxRange && i !== hoveredMeshIndex && !spreadingState) {
      const intensity = 1 - dist / proxRange;
      const glow = intensity * 0.3;
      mesh.userData.proximityGlow = glow;
    } else {
      mesh.userData.proximityGlow = 0;
    }
  }
}

function updateAutoRotation() {
  const elapsed = performance.now() - lastInteraction;
  if (elapsed > 3000 && !flyState) {
    autoRotating = true;
    const angle = 0.0003;
    const x = camera.position.x;
    const z = camera.position.z;
    camera.position.x = x * Math.cos(angle) - z * Math.sin(angle);
    camera.position.z = x * Math.sin(angle) + z * Math.cos(angle);
  }
}

function triggerNeuralPulse() {
  if (simNodes.length === 0) return;
  const idx = Math.floor(Math.random() * simNodes.length);
  const sn = simNodes[idx];
  neuralPulseCenter = new THREE.Vector3(sn.x, sn.y, sn.z);
  neuralPulseTime = 0;
  neuralPulseActive = true;
}

function updateNeuralPulse(dt) {
  if (!neuralPulseActive || !neuralPulseCenter) return;
  neuralPulseTime += dt;
  const maxRadius = 80;
  const duration = 1.5;
  const radius = (neuralPulseTime / duration) * maxRadius;
  const fade = Math.max(0, 1 - neuralPulseTime / duration);

  for (let i = 0; i < nodeMeshes.length; i++) {
    const mesh = nodeMeshes[i];
    if (!mesh.visible) continue;
    const dist = mesh.position.distanceTo(neuralPulseCenter);
    const ringWidth = 15;
    const diff = Math.abs(dist - radius);
    if (diff < ringWidth) {
      const intensity = (1 - diff / ringWidth) * fade * 0.3;
      mesh.userData.pulseGlow = intensity;
    } else {
      mesh.userData.pulseGlow = 0;
    }
  }
  if (neuralPulseTime > duration) {
    neuralPulseActive = false;
    for (const mesh of nodeMeshes) mesh.userData.pulseGlow = 0;
  }
}

function updateNodeVisuals(time, dt) {
  const breathe = Math.sin(time * Math.PI * 0.4) * 0.025 + 1;
  const formElapsed = isBrainForming ? performance.now() - brainFormingStart : 99999;

  for (let i = 0; i < nodeMeshes.length; i++) {
    const mesh = nodeMeshes[i];
    const ud = mesh.userData;
    const node = ud.node;

    if (hiddenTypes.has(node.type)) { mesh.visible = false; continue; }
    mesh.visible = true;

    let formScale = 1, formOpacity = 1;
    if (isBrainForming) {
      const delay = i * 10;
      const prog = Math.min(Math.max(0, formElapsed - delay) / 2000, 1);
      const e = easeOutCubic(prog);
      formScale = 0.01 + e * 0.99;
      formOpacity = e;
    }

    const activePulse = ud.activation > 0.05
      ? 1 + Math.sin(time * 4 + ud.pulseOffset) * 0.08 * ud.activation : 1;

    let scale = breathe * activePulse * formScale;
    let opacity = ud.baseOpacity * formOpacity;

    if (searchQuery) {
      if (node.content.toLowerCase().includes(searchQuery)) {
        opacity = 1; scale *= 1.3;
      } else {
        opacity = 0.04; scale *= 0.4;
      }
    }

    if (selectedNode === i && !spreadingState) {
      opacity = 1; scale *= 1.2;
    }

    if (hoveredMeshIndex === i) {
      scale *= 1.15;
      opacity = Math.min(1, opacity + 0.3);
    }

    const proxGlow = ud.proximityGlow || 0;
    if (proxGlow > 0 && !spreadingState) {
      scale *= (1 + proxGlow * 0.4);
      opacity = Math.min(1, opacity + proxGlow * 0.3);
    }

    const pulseGlow = ud.pulseGlow || 0;
    if (pulseGlow > 0 && !spreadingState) {
      opacity = Math.min(1, opacity + pulseGlow);
      scale *= (1 + pulseGlow * 0.3);
    }

    if (ud.flashTime > 0) {
      ud.flashTime -= dt;
      const flash = Math.max(0, ud.flashTime / 0.5);
      mesh.material.color.setHex(0xffffff);
      mesh.material.color.lerp(new THREE.Color(getColor(node.type)), 1 - flash);
      opacity = Math.max(opacity, flash);
    }

    scale = Math.min(scale, 2.0);

    if (!spreadingState) {
      mesh.scale.setScalar(scale);
      mesh.material.opacity = opacity;
    }
  }

  if (isBrainForming) {
    const edgeProg = Math.max(0, Math.min((formElapsed - 800) / 1500, 1));
    if (edgeLines) edgeLines.material.opacity = edgeProg * 0.7;
    if (flowParticles) flowParticles.material.opacity = edgeProg * 0.7;
    if (formElapsed > 3000) isBrainForming = false;
  }
}

function animateValue(el, target, duration) {
  const text = el.textContent || '0';
  let start = 0;
  if (text.endsWith('k')) start = parseFloat(text) * 1000;
  else if (text.endsWith('M')) start = parseFloat(text) * 1000000;
  else start = parseInt(text) || 0;
  if (Math.round(start) === target) return;
  const t0 = performance.now();
  function tick(now) {
    const p = Math.min((now - t0) / duration, 1);
    const val = Math.round(start + (target - start) * easeOutCubic(p));
    el.textContent = formatNumber(val);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function updateStats(stats) {
  animateValue(document.getElementById('s-nodes'), stats.totalNodes, 1500);
  animateValue(document.getElementById('s-edges'), stats.totalEdges, 1500);
  animateValue(document.getElementById('s-patterns'), stats.totalPatterns, 1500);
  animateValue(document.getElementById('s-sessions'), stats.totalSessions, 1500);
  const totalAct = graphNodes.reduce((s, n) => s + (n.activation_count || 0), 0);
  animateValue(document.getElementById('s-activations'), totalAct, 1500);

  const bl = document.getElementById('brain-level');
  if (bl) {
    const n = stats.totalNodes || 0;
    const levels = [
      { min: 0, name: 'Newborn Brain', color: 'var(--muted)' },
      { min: 25, name: 'Awakening Brain', color: 'var(--cyan)' },
      { min: 75, name: 'Growing Brain', color: 'var(--cyan)' },
      { min: 200, name: 'Active Brain', color: 'var(--green)' },
      { min: 500, name: 'Sharp Brain', color: 'var(--green)' },
      { min: 1000, name: 'Powerful Brain', color: 'var(--purple)' },
      { min: 2500, name: 'Brilliant Brain', color: 'var(--purple)' },
      { min: 5000, name: 'Genius Brain', color: 'var(--gold)' },
      { min: 10000, name: 'Mastermind', color: 'var(--gold)' },
      { min: 25000, name: 'Superintelligence', color: 'var(--gold)' },
    ];
    let lvl = 0;
    for (let i = levels.length - 1; i >= 0; i--) {
      if (n >= levels[i].min) { lvl = i; break; }
    }
    const current = levels[lvl];
    bl.textContent = current.name;
    bl.style.color = current.color;

    const levelNum = lvl + 1;
    const nextMin = lvl < levels.length - 1 ? levels[lvl + 1].min : levels[lvl].min;
    const currMin = levels[lvl].min;
    const progress = lvl < levels.length - 1 ? Math.min(1, (n - currMin) / (nextMin - currMin)) : 1;

    const ring = document.getElementById('health-ring');
    const circ = 150.8;
    ring.style.stroke = current.color;
    ring.setAttribute('stroke-dashoffset', String(circ * (1 - progress)));
    document.getElementById('health-text').textContent = levelNum;

    const sRing = document.getElementById('sidebar-health-ring');
    sRing.style.stroke = current.color;
    sRing.setAttribute('stroke-dashoffset', String(94.2 * (1 - progress)));
    document.getElementById('sidebar-health-text').textContent = levelNum;
  }
}

const MAX_LEGEND_VISIBLE = 5;
let legendExpanded = false;

function buildLegend() {
  const typeCounts = {};
  for (const n of graphNodes) {
    typeCounts[n.type] = (typeCounts[n.type] || 0) + 1;
  }
  const types = Object.keys(typeCounts).sort((a, b) => typeCounts[b] - typeCounts[a]);
  const legend = document.getElementById('legend');
  legend.innerHTML = '';

  const visibleTypes = legendExpanded ? types : types.slice(0, MAX_LEGEND_VISIBLE);
  const hiddenCount = types.length - MAX_LEGEND_VISIBLE;

  for (const t of visibleTypes) {
    const el = document.createElement('div');
    el.className = 'legend-item' + (hiddenTypes.has(t) ? ' hidden' : ' active');
    el.innerHTML = `<div class="legend-dot" style="background:${getColorHex(t)}"></div>${t}`;
    el.addEventListener('click', () => {
      if (hiddenTypes.has(t)) {
        hiddenTypes.delete(t);
        el.classList.remove('hidden');
        el.classList.add('active');
      } else {
        hiddenTypes.add(t);
        el.classList.add('hidden');
        el.classList.remove('active');
      }
      rebuildEdges();
      createFlowParticles();
    });
    legend.appendChild(el);
  }

  if (hiddenCount > 0) {
    const overflow = document.createElement('div');
    overflow.className = 'legend-overflow';
    overflow.textContent = legendExpanded ? 'less' : `+${hiddenCount}`;
    overflow.addEventListener('click', () => {
      legendExpanded = !legendExpanded;

async function checkDaemon() {
  const li = document.getElementById('live-status');
  const lt = document.getElementById('live-text');
  const tip = document.getElementById('live-tooltip');
  try {
    const res = await fetch('http://localhost:7899/health', { signal: AbortSignal.timeout(2000) });
    const data = await res.json();
    li.classList.remove('offline', 'paused');
    if (data.status === 'paused') {
      li.classList.add('paused');
      lt.textContent = 'Paused';
      if (tip) tip.textContent = 'Watcher paused — click to resume';
    } else {
      lt.textContent = 'Live';
      if (tip) tip.textContent = 'Watcher active — click to pause';
    }
  } catch {
    li.classList.remove('paused');
    li.classList.add('offline');
    lt.textContent = 'Offline';
    if (tip) tip.textContent = 'Watcher offline. Run: brainbase watch';
  }
}

document.getElementById('live-status').addEventListener('click', async () => {
  const li = document.getElementById('live-status');
  if (li.classList.contains('offline')) return;
  const isPaused = li.classList.contains('paused');
  try {
    await fetch(`http://localhost:7899/${isPaused ? 'resume' : 'pause'}`, { method: 'POST' });
    checkDaemon();
  } catch {}
});

function renderMemories(allNodes, container) {
  const listWrap = document.getElementById('memory-list');
  if (!listWrap) return;
  listWrap.innerHTML = '';

  let filtered = allNodes;
  if (memoryFilter !== 'all') filtered = filtered.filter(n => n.type === memoryFilter);
  if (memorySearchQuery) filtered = filtered.filter(n => n.content.toLowerCase().includes(memorySearchQuery));

  if (memoryTimeRange !== 'all') {
    const now = Date.now();
    const ranges = { today: 86400000, '7d': 7*86400000, '30d': 30*86400000 };
    const cutoff = now - (ranges[memoryTimeRange] || 0);
    filtered = filtered.filter(n => (n.created_at || 0) > cutoff);
  }

  const sortFns = {
    newest: (a,b) => (b.created_at||0) - (a.created_at||0),
    oldest: (a,b) => (a.created_at||0) - (b.created_at||0),
    importance: (a,b) => (b.importance||0) - (a.importance||0),
    active: (a,b) => (b.last_activated||0) - (a.last_activated||0),
  };
  filtered.sort(sortFns[memorySortBy] || sortFns.newest);
  const showing = filtered.slice(0, memoryShowCount);

  if (showing.length === 0) {
    listWrap.innerHTML = '<div class="empty-state">No memories found.</div>';
    return;
  }

  showing.forEach(node => {
    const card = document.createElement('div');
    card.className = 'memory-card';
    card.innerHTML = `<div class="memory-header">
        <span class="memory-type" style="color:${getColorHex(node.type)};background:${getColorHex(node.type)}15">${node.type}</span>
        <span class="memory-date">${formatDate(node.created_at)}</span>
      </div>
      <div class="memory-text">${node.content}</div>
      <div class="memory-importance">
        <div class="memory-importance-fill" style="width:${((node.importance||0)*100)}%;background:${getColorHex(node.type)}"></div>
      </div>`;
    const nIdx = nodeMap[node.id];
    if (nIdx !== undefined) {
      const locBtn = document.createElement('button');
      locBtn.className = 'memory-locate-btn';
      locBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4m10-10h-4M6 12H2"/></svg>Locate in Brain';
      locBtn.addEventListener('click', () => {
        switchTab('brain');
        setTimeout(() => {
          selectedNode = nIdx;
          flyToNode(nIdx);
          showDetailPanel(nIdx);
          triggerSpreading(nIdx);
        }, 100);
      });
      card.appendChild(locBtn);
    }
    listWrap.appendChild(card);
  });

  if (filtered.length > memoryShowCount) {
    const btn = document.createElement('button');
    btn.className = 'show-more-btn';
    btn.textContent = `Show more (${filtered.length - memoryShowCount} remaining)`;
    btn.addEventListener('click', () => {
      memoryShowCount += 50;
      renderMemories(allNodes, container);
    });
    listWrap.appendChild(btn);
  }

  container.querySelectorAll('.filter-pill:not([data-time-range])').forEach(pill => {
    pill.classList.toggle('active', pill.textContent.toLowerCase() === memoryFilter || (memoryFilter === 'all' && pill.textContent === 'All'));
  });
  container.querySelectorAll('.filter-pill[data-time-range]').forEach(pill => {
    pill.classList.toggle('active', pill.dataset.timeRange === memoryTimeRange);
  });
}

function drawGrowthChart(snapshots) {
  const c = document.getElementById('growth-chart');
  if (!c) return;
  const ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = c.parentElement.getBoundingClientRect();
  const w = rect.width, h = 260;
  c.width = w * dpr; c.height = h * dpr;
  c.style.width = w + 'px'; c.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  if (snapshots.length < 2) {
    ctx.fillStyle = '#6B7280';
    ctx.font = '14px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Day 1 — your brain just woke up. The growth curve appears after 2+ days.', w/2, h/2);
    return;
  }

  const pad = { top: 24, right: 24, bottom: 44, left: 54 };
  const pw = w - pad.left - pad.right, ph = h - pad.top - pad.bottom;
  const maxN = Math.max(...snapshots.map(s=>s.node_count));
  const maxE = Math.max(...snapshots.map(s=>s.edge_count));
  const maxV = Math.max(maxN, maxE, 1);

  ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + ph * i / 4;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w-pad.right, y); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.font = '10px JetBrains Mono'; ctx.textAlign = 'right';
    ctx.fillText(Math.round(maxV*(4-i)/4), pad.left-10, y+4);
  }

  function drawLine(data, color) {
    ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (let i=0; i<data.length; i++) {
      const x = pad.left + (i/(data.length-1))*pw;
      const y = pad.top + ph - (data[i]/maxV)*ph;
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.stroke();
    const gradient = ctx.createLinearGradient(0, pad.top, 0, pad.top + ph);
    gradient.addColorStop(0, color.replace(')', ',0.15)').replace('rgb', 'rgba'));
    gradient.addColorStop(1, color.replace(')', ',0)').replace('rgb', 'rgba'));
    ctx.lineTo(pad.left + pw, pad.top + ph);
    ctx.lineTo(pad.left, pad.top + ph);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();
  }

  drawLine(snapshots.map(s=>s.node_count), 'rgb(0,240,255)');
  drawLine(snapshots.map(s=>s.edge_count), 'rgb(168,85,247)');

  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.font = '10px JetBrains Mono'; ctx.textAlign = 'center';
  const step = Math.max(1, Math.floor(snapshots.length / 6));
  for (let i=0; i<snapshots.length; i+=step) {
    const x = pad.left + (i/(snapshots.length-1))*pw;
    ctx.fillText(snapshots[i].date, x, h - pad.bottom + 20);
  }

  ctx.fillStyle = 'rgb(0,240,255)'; ctx.beginPath(); ctx.arc(pad.left, h-12, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '11px Inter'; ctx.textAlign = 'left';
  ctx.fillText('Neurons', pad.left+10, h-8);
  ctx.fillStyle = 'rgb(168,85,247)'; ctx.beginPath(); ctx.arc(pad.left+85, h-12, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('Synapses', pad.left+95, h-8);
}

async function loadData() {
  try {
    const res = await fetch('/api/graph');
    const data = await res.json();
    graphNodes = data.nodes;
    graphEdges = data.edges;
    nodeMap = {};
    graphNodes.forEach((n, i) => { nodeMap[n.id] = i; });
    initSimulation();
    updateStats(data.stats);
    buildLegend();
    updateHealthRing();
    checkDaemon();
    dataLoaded = true;
    setTimeout(() => {
      document.getElementById('loader').classList.add('hidden');
    }, 800);
  } catch (err) {
    console.error('Failed to load graph data:', err);
    document.getElementById('loader-text').textContent = 'Failed to connect. Retrying...';
    setTimeout(loadData, 3000);
  }
}

function showGrowthToast(newNodes, newEdges) {
  const existing = document.querySelector('.growth-toast');
  if (existing) existing.remove();
  const parts = [];
  if (newNodes > 0) parts.push(`+${newNodes} neuron${newNodes > 1 ? 's' : ''}`);
  if (newEdges > 0) parts.push(`+${newEdges} synapse${newEdges > 1 ? 's' : ''}`);
  if (parts.length === 0) return;
  const toast = document.createElement('div');
  toast.className = 'growth-toast';
  toast.textContent = parts.join(' \u00B7 ');
  document.body.appendChild(toast);
  setTimeout(() => toast.classList.add('fade-out'), 3500);
  setTimeout(() => toast.remove(), 4000);
}

async function poll() {
  if (currentTab !== 'brain') return;
  try {
    const res = await fetch('/api/graph');
    const data = await res.json();
    if (data.nodes.length !== graphNodes.length || data.edges.length !== graphEdges.length) {
      const newN = data.nodes.length - graphNodes.length;
      const newE = data.edges.length - graphEdges.length;
      if (newN > 0 || newE > 0) showGrowthToast(newN, newE);
      const existingPos = {};
      simNodes.forEach(sn => { existingPos[sn.node.id] = { x:sn.x, y:sn.y, z:sn.z }; });
      graphNodes = data.nodes;
      graphEdges = data.edges;
      nodeMap = {};
      graphNodes.forEach((n, i) => { nodeMap[n.id] = i; });
      simNodes = graphNodes.map(n => {
        const ep = existingPos[n.id];
        if (ep) return { ...ep, vx:0, vy:0, vz:0, node:n };
        return { x:(Math.random()-0.5)*40, y:(Math.random()-0.5)*40, z:(Math.random()-0.5)*40, vx:0, vy:0, vz:0, node:n };
      });
      while (nodeGroup.children.length > 0) {
        const c = nodeGroup.children[0];
        c.geometry.dispose(); c.material.dispose(); nodeGroup.remove(c);
      }
      nodeMeshes = [];
      for (const sn of simNodes) {
        const mesh = createNodeMesh(sn.node, new THREE.Vector3(sn.x, sn.y, sn.z));
        if (!existingPos[sn.node.id]) mesh.userData.flashTime = 0.5;
        nodeGroup.add(mesh); nodeMeshes.push(mesh);
      }
      computeNodeDegree();
      buildPhysicsEdges();
      rebuildEdges();
      createFlowParticles();
      const brainRadius = Math.max(120, Math.sqrt(graphNodes.length) * 12);
      controls.maxDistance = brainRadius * 4;
      camera.far = Math.max(2000, brainRadius * 8);
      camera.updateProjectionMatrix();
      scene.fog = new THREE.FogExp2(0x06060F, Math.min(0.0008, 0.15 / brainRadius));
      updateStats(data.stats);
      buildLegend();
      frameCount = 0;
    }
  } catch {}
}

loadData();
lastInteraction = performance.now();
setInterval(poll, 3000);
setInterval(checkDaemon, 10000);
setInterval(updateHealthRing, 30000);

let pulseTimer = 0;
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = clock.getDelta();
  const time = clock.getElapsedTime();
  frameCount++;

  if (frameCount < 300 && frameCount % 2 === 0) { stepSimulation(); updateMaxZoom(); }
  else if (frameCount < 600 && frameCount % 8 === 0) { stepSimulation(); updateMaxZoom(); }
  else if (frameCount % 30 === 0) { stepSimulation(); updateMaxZoom(); }

  if (currentTab !== 'brain') return;

  updateProximityGlow();
  updateAutoRotation();

  pulseTimer += dt;
  if (pulseTimer > 4) {
    pulseTimer = 0;
    triggerNeuralPulse();
  }
  updateNeuralPulse(dt);

  updateNodeVisuals(time, dt);
  updateSpreadingVisuals();
  updateFlyTo();
  updateFlowParticles();

  if (dustParticles) {
    const dpos = dustParticles.geometry.attributes.position;
    for (let i = 0; i < dpos.count; i++) {
      dpos.array[i*3+1] += Math.sin(time * 0.3 + i) * 0.02;
    }
    dpos.needsUpdate = true;
  }

  controls.update();
  composer.render();
}

animate();
</script>
